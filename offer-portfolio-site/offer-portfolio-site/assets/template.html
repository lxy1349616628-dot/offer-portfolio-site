<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F8F4F2; --ink:#2E1D18; --accent:#A63F62; --soft:#F3E3E7; --muted:#6E5A54;
  --body:#4A3630; --line:#E6DCD8; --plate:#EFE6E3; --card:#FFFFFF;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --serif-en:'Cormorant Garamond',Georgia,serif; --serif:'Noto Serif SC','Songti SC',serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans SC',system-ui,-apple-system,'PingFang SC',sans-serif}
img{max-width:100%}
a{color:var(--accent)}
.page{max-width:560px;margin:0 auto;padding-bottom:0}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}

/* nav */
.nav{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--ground) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.nav .brand{font-family:var(--serif-en);font-style:italic;font-weight:600;font-size:22px;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav .links{display:flex;gap:2px;overflow-x:auto}
.nav .links a{font-size:13px;color:var(--ink);text-decoration:none;padding:12px 8px;white-space:nowrap}
.nav .links a.hot{color:var(--accent)}

/* hero */
.hero{padding:20px 16px 8px;display:flex;flex-direction:column;gap:16px}
.eyebrow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.18em}
.hero-photo{width:100%;height:min(430px,110vw);object-fit:cover;object-position:50% 45%;border-radius:2px;display:block}
.hero-photo.ph{background:var(--plate);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.namebar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.namebar h1{margin:0;font-family:var(--serif-en);font-style:italic;font-weight:600;font-size:64px;line-height:.95;letter-spacing:-.01em}
.namebar .roles{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.55;padding-bottom:6px}
.intro{margin:0;font-size:14px;line-height:1.75;color:var(--body)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-top:4px}
.stats>div{padding:14px 0 14px 12px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:none}
.num{font-family:var(--serif);font-weight:900;color:var(--accent)}
.stats .num{font-size:22px}
.lbl{font-size:11px;color:var(--muted);line-height:1.4}

/* section heads */
.sec{padding:36px 16px 8px;display:flex;flex-direction:column;gap:20px;scroll-margin-top:52px}
.sec-head{display:flex;align-items:baseline;gap:12px}
.sec-head .no{font-family:var(--serif-en);font-style:italic;font-weight:600;font-size:30px;color:var(--accent)}
.sec-head h2{margin:0;font-family:var(--serif);font-weight:900;font-size:22px}
.sec-intro{margin:-8px 0 0;font-size:14px;line-height:1.75;color:var(--body)}

/* ability cell */
.cell-wrap{display:flex;justify-content:center}
.cell-box{width:358px;height:358px;position:relative;transform-origin:top center}
.membrane{position:absolute;inset:0;border-radius:50%;background:var(--soft);border:2px solid color-mix(in srgb,var(--accent) 22%,var(--soft));animation:breathe 7s ease-in-out infinite}
.membrane2{position:absolute;inset:12px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--accent) 25%,var(--soft))}
.ribo{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 40%,var(--soft))}
.org{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;border:none;padding:0;cursor:pointer;overflow:hidden;font-family:inherit;text-align:left;background:var(--bg);color:var(--fg);z-index:1;
  transition:left .75s var(--ease),top .75s var(--ease),width .75s var(--ease),height .75s var(--ease),border-radius .75s var(--ease),opacity .4s ease,scale .55s var(--spring),box-shadow .6s ease;
  animation:float var(--dur,6s) ease-in-out var(--delay,0s) infinite}
.org.core{z-index:2;animation:none;box-shadow:0 0 0 8px color-mix(in srgb,var(--ink) 8%,transparent),0 0 0 18px color-mix(in srgb,var(--ink) 4%,transparent)}
.org.sel{left:0;top:0;width:358px;height:358px;border-radius:30px;z-index:5;animation:none;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.cell-box.has-sel .org:not(.sel){opacity:0;scale:.5;pointer-events:none}
.org .o-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;transition:opacity .25s ease}
.org .o-label b{font-family:var(--serif);font-weight:900;font-size:14px}
.org.core .o-label b{font-size:18px}
.org .o-label i{font-family:var(--serif-en);font-size:12px;opacity:.75}
.org.sel .o-label{opacity:0}
.o-detail{position:absolute;top:0;left:0;width:358px;height:358px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(10px);transition:opacity .15s ease,transform .15s ease}
.org.sel .o-detail{opacity:1;transform:none;transition:opacity .45s ease .3s,transform .6s var(--ease) .3s}
.o-top{display:flex;justify-content:space-between;align-items:center}
.o-top i{font-family:var(--serif-en);font-size:15px;opacity:.8}
.o-title{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.3}
.o-sum{font-size:15px;line-height:1.7;font-weight:500}
.o-subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.o-subs>span{display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 10px}
.o-subs b{font-size:13px;color:color-mix(in srgb,var(--accent) 35%,#fff)}
.o-subs em{font-style:normal;font-size:11.5px;line-height:1.5}
.o-chip{margin-top:auto;align-self:flex-start;font-size:12px;font-weight:500;color:var(--accent);background:#fff;border-radius:12px;padding:4px 10px}
.cell-hint{text-align:center;font-size:12px;color:var(--muted)}

/* work cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s ease}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}}
.gallery{display:flex;align-items:center;justify-content:safe center;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:20px 16px;background:var(--plate);border-bottom:1px solid var(--line)}
.gallery img{flex:0 0 auto;display:block;width:auto;height:auto;max-width:290px;max-height:380px;border-radius:6px;box-shadow:0 12px 26px -16px rgba(0,0,0,.5);scroll-snap-align:center}
.gallery.multi img{max-width:250px}
.gallery .ph{width:100%;height:180px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.card-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);letter-spacing:.08em}
.tag{font-size:11px;letter-spacing:0;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:1px 8px}
.card h3{margin:0;font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.35}
.card p{margin:0;font-size:14px;line-height:1.75;color:var(--body)}
.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:4px}
.wstats .num{font-size:19px}
.btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;background:var(--ink);color:var(--ground);font-size:13px;font-weight:500;text-decoration:none;transition:transform .35s var(--spring)}
.btn:active,.press:active{transform:scale(.96)}
.qa{border-top:1px solid var(--line);padding:4px 16px 10px;display:flex;flex-direction:column}
.qa-head{font-family:var(--serif-en);font-style:italic;font-size:15px;color:var(--accent);padding:10px 0 2px}
.qa-item{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.qa-q{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border:none;background:none;text-align:left;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;transition:transform .35s var(--spring)}
.qa-q:active{transform:scale(.98)}
.qa-sign{font-size:22px;font-weight:300;color:var(--accent);line-height:1;display:inline-block;transition:transform .55s var(--spring)}
.qa-item.open .qa-sign{transform:rotate(135deg)}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.qa-item.open .qa-a{grid-template-rows:1fr}
.qa-a>div{overflow:hidden;min-height:0}
.qa-inner{display:flex;gap:10px;align-items:flex-start;padding:2px 0 14px;opacity:0;transform:translateY(-8px) scale(.98);transition:opacity .45s ease,transform .6s var(--ease)}
.qa-item.open .qa-inner{opacity:1;transform:none}
.qa-ava{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 30%;flex-shrink:0;background:var(--plate)}
.qa-bubble{background:var(--soft);border-radius:2px 14px 14px 14px;padding:10px 12px;font-size:13px;line-height:1.75;white-space:pre-line}

/* videos */
.vrow{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px}
.vcard{flex:0 0 150px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.vcover{position:relative;height:266px;background:var(--ink);border-radius:4px;overflow:hidden;transition:transform .35s var(--spring)}
.vcard:active .vcover{transform:scale(.96)}
.vcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vcover img.contain{object-fit:contain}
.vplay{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.vt{font-size:13px;font-weight:500}
.vm{font-size:11px;color:var(--muted);margin-top:-4px}

/* contact */
.contact{margin-top:40px;padding:36px 16px 44px;background:var(--ink);color:var(--ground);display:flex;flex-direction:column;gap:18px;scroll-margin-top:52px}
.contact .big{font-family:var(--serif-en);font-style:italic;font-weight:600;font-size:44px;line-height:1}
.contact p{margin:0;font-size:14px;line-height:1.75;opacity:.85}
.crows{display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.18)}
.crows div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:13px}
.crows span:first-child{opacity:.7}
.crows a{color:inherit}
.cbtn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:26px;background:var(--ground);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;transition:transform .35s var(--spring)}
.cbtn:active{transform:scale(.96)}
.sign{font-family:var(--serif-en);font-style:italic;font-size:14px;opacity:.7;padding-top:12px}

/* motion */
@keyframes heroImg{from{opacity:0;transform:scale(1.08);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(36px) scale(.97)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.015}}
.hero-photo{animation:heroImg 1.4s var(--ease) both}
.up1{animation:up .9s var(--ease) .35s both}.up2{animation:up .9s var(--ease) .5s both}
.up3{animation:up .9s var(--ease) .65s both}.up4{animation:up .9s var(--ease) .8s both}
.reveal{opacity:0;transform:translateY(36px) scale(.97);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
@supports (animation-timeline: view()){
  .reveal,.reveal.in{opacity:1;transform:none;transition:none;animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script id="site-data" type="application/json">__SITE_DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('site-data').textContent);
  var T = D.theme || {};
  var root = document.documentElement.style;
  ['ground','ink','accent','soft','muted','body','line','plate'].forEach(function(k){ if (T[k]) root.setProperty('--' + k, T[k]); });
  var P = D.profile || {};
  document.title = (D.meta && D.meta.title) || ((P.name || '') + ' · 作品集');
  if (D.meta && D.meta.lang) document.documentElement.lang = D.meta.lang;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function br(s){ return esc(s).replace(/\n/g, '<br>'); }
  function src(x){ return typeof x === 'string' ? x : (x && x.src) || ''; }
  var PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5.5l11 6.5-11 6.5z"></path></svg>';
  var CLOSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
  var DL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"></path></svg>';

  var sections = D.sections || [];
  var h = [];

  // nav
  h.push('<nav class="nav"><a class="brand" href="#top">' + esc(P.name) + '</a><div class="links noscroll">');
  if (D.abilities) h.push('<a href="#abilities">' + esc(D.abilities.nav || '能力') + '</a>');
  sections.forEach(function(s, i){ h.push('<a href="#s' + i + '">' + esc(s.nav || s.title.slice(0, 2)) + '</a>'); });
  if (D.contact) h.push('<a class="hot" href="#contact">' + esc(D.contact.nav || '联系') + '</a>');
  h.push('</div></nav>');

  // hero
  h.push('<section class="hero" id="top"><div class="eyebrow"><span>PORTFOLIO</span><span>' + esc(P.year || new Date().getFullYear()) + '</span></div>');
  h.push(P.photo ? '<img class="hero-photo" src="' + esc(P.photo) + '" alt="' + esc(P.name) + '">' : '<div class="hero-photo ph">在这里放一张你的照片</div>');
  h.push('<div class="namebar"><h1 class="up1">' + esc(P.name) + '</h1>');
  if (P.roles && P.roles.length) h.push('<div class="roles up2">' + P.roles.map(esc).join('<br>') + '</div>');
  h.push('</div>');
  if (P.intro) h.push('<p class="intro up3">' + br(P.intro) + '</p>');
  if (D.stats && D.stats.length) {
    h.push('<div class="stats up4">');
    D.stats.slice(0, 3).forEach(function(s){ h.push('<div><div class="num">' + esc(s.num) + '</div><div class="lbl">' + esc(s.label) + '</div></div>'); });
    h.push('</div>');
  }
  h.push('</section>');

  // abilities cell
  var A = D.abilities;
  var POS = [ {x:40,y:50,s:92}, {x:232,y:40,s:84}, {x:38,y:216,s:88}, {x:228,y:214,s:96} ];
  var TINTS = ['#F2CFD9', '#EAD7C6', '#D9E6D2', '#F1E3DB'];
  if (A) {
    h.push('<section class="sec" id="abilities"><div class="sec-head reveal"><span class="no">Abilities</span><h2>' + esc(A.title || '能力版图') + '</h2></div>');
    h.push('<div class="cell-wrap reveal"><div class="cell-box" id="cell"><div class="membrane" aria-hidden="true"></div><div class="membrane2" aria-hidden="true"></div>');
    [[160,40,8],[182,58,5],[60,170,6],[300,176,7],[172,304,6],[150,290,4]].forEach(function(r){ h.push('<span class="ribo" aria-hidden="true" style="left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[2] + 'px"></span>'); });
    var orgs = [];
    if (A.core) orgs.push({ core: true, d: A.core, x: 113, y: 113, s: 132, bg: 'var(--ink)', fg: 'var(--ground)' });
    (A.items || []).slice(0, 4).forEach(function(it, i){ orgs.push({ d: it, x: POS[i].x, y: POS[i].y, s: POS[i].s, bg: it.color || TINTS[i], fg: 'var(--ink)', dur: 6 + i * 0.5, delay: i * 0.7 }); });
    orgs.forEach(function(o, i){
      var d = o.d;
      h.push('<button type="button" class="org' + (o.core ? ' core' : '') + '" aria-expanded="false" style="--x:' + o.x + 'px;--y:' + o.y + 'px;--s:' + o.s + 'px;--bg:' + o.bg + ';--fg:' + o.fg + ';--dur:' + (o.dur || 6) + 's;--delay:' + (o.delay || 0) + 's">');
      h.push('<span class="o-label"><b>' + esc(d.label) + '</b><i>' + esc(d.en || '') + '</i></span>');
      h.push('<span class="o-detail"><span class="o-top"><i>' + esc(d.en || '') + '</i>' + CLOSE + '</span><span class="o-title">' + esc(d.label) + '</span><span class="o-sum">' + esc(d.summary) + '</span>');
      if (d.subs && d.subs.length) { h.push('<span class="o-subs">'); d.subs.slice(0, 4).forEach(function(u){ h.push('<span><b>' + esc(u.name) + '</b><em>' + esc(u.desc) + '</em></span>'); }); h.push('</span>'); }
      if (d.result) h.push('<span class="o-chip">' + esc(d.result) + '</span>');
      h.push('</span></button>');
    });
    h.push('</div></div><div class="cell-hint" id="cell-hint">点一下细胞器，看看里面有什么</div></section>');
  }

  // sections
  var no = 0;
  sections.forEach(function(S, si){
    no++;
    h.push('<section class="sec" id="s' + si + '"><div class="sec-head reveal"><span class="no">' + (no < 10 ? '0' : '') + no + '</span><h2>' + esc(S.title) + '</h2></div>');
    if (S.intro) h.push('<p class="sec-intro">' + br(S.intro) + '</p>');
    if (S.type === 'videos') {
      h.push('<div class="vrow noscroll">');
      (S.videos || []).forEach(function(v){
        var tag = v.link ? 'a' : 'div';
        h.push('<' + tag + ' class="vcard reveal"' + (v.link ? ' href="' + esc(v.link) + '" target="_blank" rel="noopener"' : '') + '><div class="vcover">');
        if (v.cover) h.push('<img src="' + esc(src(v.cover)) + '" alt="' + esc(v.title) + '"' + (v.fit === 'contain' ? ' class="contain"' : '') + (v.pos ? ' style="object-position:' + esc(v.pos) + '"' : '') + '>');
        h.push('<span class="vplay">' + PLAY + '</span></div><div class="vt">' + esc(v.title) + '</div>' + (v.meta ? '<div class="vm">' + esc(v.meta) + '</div>' : '') + '</' + tag + '>');
      });
      h.push('</div>');
    } else {
      (S.works || []).forEach(function(w){
        h.push('<article class="card reveal">');
        var imgs = w.images || [];
        if (imgs.length) {
          h.push('<div class="gallery noscroll' + (imgs.length > 1 ? ' multi' : '') + '">');
          imgs.forEach(function(im, j){ h.push('<img src="' + esc(src(im)) + '" alt="' + esc((im && im.alt) || (w.title + ' 图' + (j + 1))) + '" loading="lazy">'); });
          h.push('</div>');
        }
        h.push('<div class="card-body">');
        if (w.kicker || w.tag) h.push('<div class="kick">' + (w.kicker ? '<span>' + esc(w.kicker) + '</span>' : '') + (w.tag ? '<span class="tag">' + esc(w.tag) + '</span>' : '') + '</div>');
        h.push('<h3>' + esc(w.title) + '</h3>');
        if (w.desc) h.push('<p>' + br(w.desc) + '</p>');
        if (w.stats && w.stats.length) { h.push('<div class="wstats">'); w.stats.slice(0, 3).forEach(function(s){ h.push('<div><div class="num">' + esc(s.num) + '</div><div class="lbl">' + esc(s.label) + '</div></div>'); }); h.push('</div>'); }
        if (w.cta) h.push('<a class="btn" href="' + esc(w.cta.link || '#') + '"' + (w.cta.link ? ' target="_blank" rel="noopener"' : '') + '>' + esc(w.cta.label || w.cta) + '</a>');
        h.push('</div>');
        if (w.qa && w.qa.length) {
          h.push('<div class="qa"><div class="qa-head">' + esc(D.qaTitle || '你可能想问') + '</div>');
          w.qa.forEach(function(q){
            h.push('<div class="qa-item"><button type="button" class="qa-q" aria-expanded="false"><span>' + esc(q.q) + '</span><span class="qa-sign" aria-hidden="true">+</span></button>');
            h.push('<div class="qa-a"><div><div class="qa-inner">' + (P.photo ? '<img class="qa-ava" src="' + esc(P.photo) + '" alt="">' : '<span class="qa-ava"></span>') + '<div class="qa-bubble">' + esc(q.a) + '</div></div></div></div></div>');
          });
          h.push('</div>');
        }
        h.push('</article>');
      });
    }
    h.push('</section>');
  });

  // contact
  var C = D.contact;
  if (C) {
    h.push('<section class="contact" id="contact"><div class="big">' + esc(C.headline || "Let's talk.") + '</div>');
    if (C.text) h.push('<p>' + br(C.text) + '</p>');
    if (C.rows && C.rows.length) { h.push('<div class="crows">'); C.rows.forEach(function(r){ var v = r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.value) + '</a>' : esc(r.value); h.push('<div><span>' + esc(r.label) + '</span><span>' + v + '</span></div>'); }); h.push('</div>'); }
    if (C.resume) h.push('<a class="cbtn" href="' + esc(C.resume.file || '#contact') + '"' + (C.resume.file ? ' download="' + esc(C.resume.filename || 'resume.pdf') + '"' : '') + '>' + esc(C.resume.label || '点击下载简历') + ' ' + DL + '</a>');
    h.push('<div class="sign">' + esc(P.name) + ' · ' + esc(P.year || new Date().getFullYear()) + '</div></section>');
  }

  document.getElementById('app').innerHTML = h.join('');

  // accordion
  Array.prototype.forEach.call(document.querySelectorAll('.qa-q'), function(b){
    b.addEventListener('click', function(){
      var it = b.parentNode, open = !it.classList.contains('open');
      it.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });

  // cell
  var cell = document.getElementById('cell');
  if (cell) {
    var hint = document.getElementById('cell-hint');
    Array.prototype.forEach.call(cell.querySelectorAll('.org'), function(o){
      o.addEventListener('click', function(){
        var was = o.classList.contains('sel');
        Array.prototype.forEach.call(cell.querySelectorAll('.org'), function(x){ x.classList.remove('sel'); x.setAttribute('aria-expanded', 'false'); });
        if (!was) { o.classList.add('sel'); o.setAttribute('aria-expanded', 'true'); }
        cell.classList.toggle('has-sel', !was);
        hint.textContent = was ? '点一下细胞器，看看里面有什么' : '再点一下收起';
      });
    });
    var fit = function(){
      var avail = cell.parentNode.clientWidth, k = Math.min(1, avail / 358);
      cell.style.transform = k < 1 ? 'scale(' + k + ')' : '';
      cell.parentNode.style.height = (358 * k) + 'px';
    };
    fit(); window.addEventListener('resize', fit);
  }

  // reveal fallback for browsers without scroll-driven animations
  if (!(window.CSS && CSS.supports && CSS.supports('animation-timeline: view()')) && 'IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: 0.12 });
    Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function(el){ io.observe(el); });
  } else if (!('IntersectionObserver' in window)) {
    Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function(el){ el.classList.add('in'); });
  }
})();
</script>
</body>
</html>
